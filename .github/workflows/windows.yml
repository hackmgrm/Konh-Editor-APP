# Windows 安装包。push 到 main 时自动跑，也可以在 Actions → Windows 安装包 → Run workflow 手动触发。
# 跑完在这次运行的 Artifacts 里下载 .exe。
name: Windows 安装包

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # rust-toolchain.toml 会把版本钉住，这里只负责让 rustup 在场
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 前端构建（含类型检查）
        run: npm run build

      - name: 发布与排版回归测试
        run: npm run test:publishing

      - name: 效率中心回归测试
        run: npm run test:productivity

      - name: 主题与上游整合测试
        run: |
          npm run test:theme
          npm run test:upstream
          npm run test:gzh

      - name: 日记图片与统一备份入口测试
        run: >
          npx vitest run
          src/tongyun/utils/journalImages.test.ts
          src/tongyun/data/domainDatabase.test.ts
          src/tongyun/data/repositories.test.ts
          src/backupDisabled.test.js
          src/unifiedBackup.test.ts
          src/tongyun/components/sync/UnifiedBackupPanel.test.tsx

      - name: Rust 测试（含备份、维护锁与集成测试）
        working-directory: src-tauri
        run: cargo test --locked

      - name: 打包
        run: npm run app:build -- --bundles nsis

      - name: 确认安装包与图标都在产物里
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction Stop
          if (-not $exe) { throw "没有生成 NSIS 安装包" }
          $exe | ForEach-Object { "{0} ({1:N0} bytes)" -f $_.Name, $_.Length }
          if ($exe.Length -lt 5MB) { throw "安装包体积异常，可能没有包含图标与前端资源" }

      - uses: actions/upload-artifact@v4
        with:
          name: konh-editor-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
