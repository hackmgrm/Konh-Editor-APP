<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="火星编辑器">
  <!--
    Horizon mark: Mars rising over a writing baseline.
    Two solid shapes, one hue family (rust planet, darkened-rust baseline) on warm paper.
    Kept deliberately chunky: the 10-unit baseline and 6-unit gap survive at 16px.
  -->
  <rect width="100" height="100" rx="22" fill="#F1ECE3"/>
  <path d="M18 58A32 32 0 0 1 82 58Z" fill="#C4482A"/>
  <rect x="14" y="64" width="72" height="10" rx="5" fill="#6E2715"/>
</svg>
